name: Brew validation

on:
  push:
    paths:
      - "docs/Apps/Brew/**"
      - ".github/workflows/brew.yml"
  pull_request:
    paths:
      - "docs/Apps/Brew/**"
      - ".github/workflows/brew.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/Apps/Brew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check
