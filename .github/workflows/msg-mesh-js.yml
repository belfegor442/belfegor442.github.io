name: msg.mesh JavaScript checks

on:
  push:
    paths:
      - "docs/app/services/msg.mesh/**"
      - ".github/workflows/msg-mesh-js.yml"
  pull_request:
    paths:
      - "docs/app/services/msg.mesh/**"
      - ".github/workflows/msg-mesh-js.yml"

concurrency:
  group: msg-mesh-js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check msg.mesh JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
            count=$((count + 1))
          done < <(find docs/app/services/msg.mesh -type f -name '*.js' -print0)
          test "$count" -gt 0
          echo "Validated $count JavaScript files."
