<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>New World — Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px;
      background: #101010;
      color: #f1f1ed;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(100%, 760px); text-align: center; }
    .eyebrow {
      margin: 0 0 28px;
      color: #85857f;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 88px);
      font-weight: 600;
      letter-spacing: -.065em;
      line-height: 1;
    }
    .rule {
      width: 42px;
      height: 1px;
      margin: 34px auto 0;
      background: #77776f;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">North Assembly</p>
    <h1>Coming Soon</h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
