<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">
<title>msg.mesh — North Assembly</title>
<link rel="icon" href="../../icon.jpg">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../../">NORTH ASSEMBLY</a><span class="slash">/</span><span class="section">MSG.MESH</span>
  <span id="connection" class="connection offline"><i></i> OFFLINE</span>
</header>
<main class="app-shell">
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar" id="selfAvatar">?</div>
      <div><strong id="selfName">Guest</strong><small id="selfHandle">@guest</small></div>
      <button class="icon-btn" id="profileBtn" aria-label="Profile">•••</button>
    </div>
    <div class="sidebar-actions">
      <button class="new-btn" id="newChatBtn">＋ NEW MESSAGE</button>
      <button class="icon-btn search-btn" id="searchBtn" aria-label="Search">⌕</button>
    </div>
    <nav class="filters">
      <button class="active" data-filter="all">ALL <span id="allCount">0</span></button>
      <button data-filter="unread">UNREAD <span id="unreadCount">0</span></button>
    </nav>
    <section class="conversation-list" id="conversationList"></section>
    <div class="sidebar-footer"><span>msg.mesh web</span><span id="syncState">LOCAL UI</span></div>
  </aside>

  <section class="chat" id="chatPanel">
    <div class="empty-state" id="emptyState">
      <div class="mesh-mark">◈</div>
      <h1>msg.mesh</h1>
      <p>Secure conversations, synchronized across your msg.mesh clients.</p>
      <button class="primary" id="startBtn">START A CONVERSATION</button>
    </div>

    <div class="chat-view hidden" id="chatView">
      <header class="chat-head">
        <button class="back-btn" id="backBtn" aria-label="Back">‹</button>
        <div class="avatar small" id="chatAvatar">?</div>
        <div class="chat-title"><strong id="chatName">Conversation</strong><small id="chatMeta">offline</small></div>
        <div class="chat-tools"><button class="icon-btn" id="chatSearchBtn">⌕</button><button class="icon-btn" id="chatInfoBtn">ⓘ</button></div>
      </header>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap">
        <div class="reply-bar hidden" id="replyBar"><span id="replyText"></span><button id="cancelReply">×</button></div>
        <form class="composer" id="composer">
          <button type="button" class="attach" id="attachBtn">＋</button>
          <input id="messageInput" autocomplete="off" maxlength="4000" placeholder="Message">
          <button class="send" type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </div>
  </section>

  <aside class="details hidden" id="details">
    <div class="details-head"><strong>Conversation</strong><button class="icon-btn" id="closeDetails">×</button></div>
    <div class="details-avatar avatar large" id="detailsAvatar">?</div>
    <h2 id="detailsName">Conversation</h2><p id="detailsHandle">@unknown</p>
    <div class="detail-block"><span>STATUS</span><strong id="detailsStatus">Offline</strong></div>
    <div class="detail-block"><span>MESSAGES</span><strong id="detailsMessages">0</strong></div>
  </aside>
</main>

<dialog id="newChatDialog">
  <form method="dialog" class="dialog-card" id="newChatForm">
    <div class="dialog-head"><strong>New conversation</strong><button value="cancel" class="icon-btn">×</button></div>
    <label>USERNAME<input id="usernameInput" required maxlength="32" placeholder="@username"></label>
    <button class="primary" value="default">OPEN CHAT</button>
    <p id="dialogStatus"></p>
  </form>
</dialog>
<script src="./app.js"></script>
</body>
</html>
