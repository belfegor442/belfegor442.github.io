<!doctype html>
<html lang="en" data-brew-build="16">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BREW — a browser-based 2.5D multiplayer social arcade world by North Assembly.">
<title>BREW — North Assembly</title>
<link rel="icon" href="../../icon.jpg">
<link rel="stylesheet" href="./style.css?v=16">
</head>
<body class="world">
<canvas id="world"></canvas>

<div id="touchControls" class="touch-controls hidden" aria-hidden="true"><div id="joystick" class="joystick"><span></span></div><button id="touchInteract" type="button">E</button><button id="touchGame" type="button">F</button></div>

<div id="hud" class="hud hidden">
  <div class="hud-top">
    <div class="world-card">
      <span class="k">BREW WORLD</span>
      <strong id="worldCode">#------</strong>
      <span class="count"><b id="playerCount">1</b><i>/</i><span id="worldMax">20</span> PLAYERS</span>
      <span class="chips">CHIPS <b id="youBalance">1000</b></span>
      <button id="shareBtn" class="mini">SHARE</button>
    </div>
    <div class="hud-actions">
      <button id="sndBtn" class="mini">SOUND ON</button>
      <button id="leaveBtn" class="mini">LEAVE</button>
    </div>
  </div>

  <aside class="roster" id="roster"></aside>

  <div class="hud-bottom">
    <div id="prompt" class="prompt hidden"></div>
    <div class="dock">
      <div class="dock-left">
        <div id="stakeBar" class="stakebar hidden">
          <span class="k">STAKE</span>
          <button data-stake="25" class="chip mini on">25</button>
          <button data-stake="50" class="chip mini">50</button>
          <button data-stake="100" class="chip mini">100</button>
        </div>
        <div id="emotes" class="emotes">
          <button data-emote="wave">1 WAVE</button>
          <button data-emote="laugh">2 LAUGH</button>
          <button data-emote="clap">3 CLAP</button>
          <button data-emote="dance">4 DANCE</button>
          <button data-emote="think">5 THINK</button>
        </div>
      </div>
      <div class="chatbox">
        <div id="chatLog" class="chatlog"></div>
        <div class="chatrow">
          <input id="chatInput" maxlength="140" placeholder="PROXIMITY CHAT — ENTER TO SEND">
          <button id="chatSend">SEND</button>
        </div>
      </div>
    </div>
  </div>

  <div id="activityPanel" class="activity hidden"></div>
  <div id="toast" class="toast hidden"></div>
</div>

<div id="entry" class="entry">
  <div class="entry-card">
    <div class="sign">
      <span class="bulbs"></span>
      <p class="eyebrow">NORTH ASSEMBLY · SOCIAL ARCADE</p>
      <h1>BREW</h1>
      <span class="bulbs"></span>
    </div>
    <div class="entry-tags">
      <span>COINFLIP</span><span>SLOTS</span><span>HIGH·LOW</span><span>RPS</span><span>ROULETTE</span><span>POKER</span>
    </div>
    <div class="entry-body">
      <label class="field"><span>YOUR NAME</span><input id="nameInput" maxlength="12" placeholder="PLAYER" autocomplete="nickname"></label>
      <label class="field"><span>WORLD CODE <em>OPTIONAL · EMPTY = NEW WORLD</em></span><input id="codeInput" maxlength="6" placeholder="A7F29" autocomplete="off"></label>
      <button id="enterBtn" class="primary" type="button">ENTER THE WORLD</button>
      <p id="entryStatus" class="status">Ready.</p>
    </div>
    <p class="pid">PLAYER ID <strong id="myPid">----</strong></p>
  </div>
</div>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js" crossorigin="anonymous"></script>
<script type="module" src="./app.js?v=16"></script>
</body>
</html>
