<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">North Assembly — abstract architectural banner</title>
<desc id="desc">Minimal futuristic architecture made from precise white and blue lines on a deep black field.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11151d"/><stop offset=".58" stop-color="#080a0f"/><stop offset="1" stop-color="#101c2b"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7de3ff" stop-opacity=".05"/><stop offset=".5" stop-color="#7de3ff" stop-opacity=".7"/><stop offset="1" stop-color="#7de3ff" stop-opacity=".04"/></linearGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b5c6dc" stroke-opacity=".08" stroke-width="1"/></pattern>
 <radialGradient id="glow"><stop stop-color="#2678a5" stop-opacity=".22"/><stop offset="1" stop-color="#2678a5" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="560" fill="url(#bg)"/><rect width="1600" height="560" fill="url(#grid)"/><ellipse cx="1110" cy="270" rx="470" ry="300" fill="url(#glow)"/>
