<!doctype html>
<html lang="en" data-version="1.0.5" data-build="2026-09-13">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search Weird Stuff projects, documentation, releases and pages."><meta name="theme-color" content="#07070a"><title>Search — Weird Stuff</title><link rel="icon" type="image/svg+xml" href="/na-mark.svg"><style>:root{--bg:#07070a;--panel:#0d0d12;--text:#f5f3f7;--muted:#aaa6b3;--dim:#686471;--line:#24212c;--purple:#9b5cff;--max:980px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(calc(100% - 36px),var(--max));margin:auto}.nav{border-bottom:1px solid var(--line);padding:22px 0}.nav a{color:var(--muted);text-decoration:none;font:11px ui-monospace,monospace;letter-spacing:1px}.hero{padding:90px 0 45px}.label{color:#bd91ff;font:9px ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(50px,8vw,90px);letter-spacing:-.07em;margin:14px 0}.hero p{color:var(--muted);line-height:1.7}.search{display:flex;gap:10px;margin:30px 0}.search input{min-width:0;flex:1;padding:17px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:#fff;font:14px ui-monospace,monospace;outline:none}.search input:focus{border-color:#9b5cff80}.search button{padding:0 20px;border:1px solid #9b5cff70;border-radius:9px;background:#9b5cff18;color:#fff;font:10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:1px}.results{display:grid;gap:10px}.result{display:block;padding:21px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none}.result:hover{border-color:#9b5cff55}.result strong{display:block;font-size:18px}.result small{display:block;margin-top:6px;color:#a77aff;font:9px ui-monospace,monospace;letter-spacing:1px;text-transform:uppercase}.result span{display:block;margin-top:8px;color:var(--dim);font:11px/1.6 ui-monospace,monospace}.empty{padding:30px 0;color:var(--dim);font:11px ui-monospace,monospace}.footer{margin-top:100px;padding:25px 0;border-top:1px solid var(--line);color:var(--dim);font:9px ui-monospace,monospace}@media(max-width:560px){.search{flex-direction:column}.search button{height:46px}}</style><link rel="stylesheet" href="/assets/css/na-site.css">
</head>
<body><header class="nav"><div class="wrap"><a href="/">← WEIRD STUFF</a></div></header><main class="wrap"><section class="hero"><div class="label">Global search</div><h1>Find it.</h1><p>Search the public Weird Stuff website for projects, documentation, releases, status pages and company resources.</p><form class="search" id="searchForm"><input id="searchInput" autocomplete="off" placeholder="Search projects, docs, releases…" aria-label="Search Weird Stuff"><button type="submit">Search</button></form><div id="results" class="results" aria-live="polite"></div></section></main><footer class="footer"><div class="wrap">WEIRD STUFF · SEARCH · v1.0.5</div></footer>
<script>(()=>{'use strict';const DATA=[
['Projects','Directory','All Weird Stuff projects and their individual pages.','/projects/'],
['Monix','Project','System monitoring and analysis project.','/projects/monix/'],
['DataLog','Project','Structured logging and data-oriented project.','/projects/datalog/'],
['Meat','Project','Experimental Weird Stuff project.','/projects/meat/'],
['Vault','Project','Storage and security-oriented project.','/projects/vault/'],
['CryptCast','Project','Experimental project in development.','/projects/cryptcast/'],
['Telenet','Project','Legacy project currently out of service.','/projects/telenet/'],
['DraftPad','Project','Legacy project currently out of service.','/projects/draftpad/'],
['Documentation','Documentation','Technical and project documentation hub.','/documentation/'],
['Developers','Developers','Developer portal, source and contribution information.','/developers/'],
['Releases','Release history','Published Weird Stuff releases and notes.','/releases/'],
['Changelog','Changelog','Version history and project changes.','/changelog/'],
['Status','Status','Current website and project operational status.','/status/'],
['Roadmap','Roadmap','Planned direction and future work.','/roadmap/'],
['Downloads','Downloads','Verified distribution and download entry points.','/downloads/'],
['Security','Security','Security policy and responsible disclosure information.','/security/'],
['Brand','Brand','Weird Stuff visual identity and brand resources.','/brand/'],
['Work With Us','Team','Contribution roles and ways to join the projects.','/work-with-us/'],
['About','Company','About Weird Stuff and the studio.','/about/'],
['Legal','Legal','Legal documents and policies.','/legal/']
];const input=document.querySelector('#searchInput'),form=document.querySelector('#searchForm'),out=document.querySelector('#results');function render(q=''){const n=q.trim().toLowerCase();const rows=DATA.filter(x=>!n||x.join(' ').toLowerCase().includes(n));out.innerHTML=rows.length?rows.map(x=>`<a class="result" href="${x[3]}"><strong>${x[0]}</strong><small>${x[1]}</small><span>${x[2]}</span></a>`).join(''):'<div class="empty">No matching pages. Try another term.</div>'}form.addEventListener('submit',e=>{e.preventDefault();render(input.value);history.replaceState(null,'',input.value?`?q=${encodeURIComponent(input.value)}`:location.pathname)});input.addEventListener('input',()=>render(input.value));const q=new URLSearchParams(location.search).get('q')||'';input.value=q;render(q)})();</script></body></html>
